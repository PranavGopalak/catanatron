name: Windows installer verification

on:
  push:
    branches:
      - codex-dev
    paths:
      - colonist-desktop/**
      - .github/workflows/windows-catanatron-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: colonist-desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: colonist-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and verify installer
        run: npm run package:win:installer

      - name: Install, launch, and uninstall
        run: npm run smoke:win:installer

      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: Catanatron-Colonist-0.8.0-Windows-x64-Setup
          if-no-files-found: error
          path: |
            colonist-desktop/release/installer/Catanatron-Colonist-0.8.0-Windows-x64-Setup.exe
            colonist-desktop/release/installer/Catanatron-Colonist-0.8.0-Windows-x64-Setup.exe.sha256
            colonist-desktop/release/installer/windows-installer-smoke.json
